# Build and test on Linux and Windows in Debug and Release.
# (File name kept for the README badge.)
name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }}${{ matrix.variant != 'default' && format(' ({0})', matrix.variant) || '' }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Debug, Release ]
        variant: [ default ]
        include:
          # extra configurations. 'variant' must differ from the base matrix,
          # or an entry would just add cmake_args to an existing job
          - os: ubuntu-latest
            build_type: Release
            variant: stats off      # keep the stats-compiled-out build working
            cmake_args: -DCMAKE_C_FLAGS=-DHT_TRACK_STATS=0
          - os: ubuntu-latest
            build_type: Debug
            variant: sanitizers     # ASan + UBSan, any report fails the job
            cmake_args: -DHT_SANITIZE=ON

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      # CMAKE_BUILD_TYPE is used by single-config generators (make/ninja); --config by multi-config (Visual Studio).
      # cmake_args is empty for the base matrix, so compiler default flags are kept
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.cmake_args }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Build benchmarks
      run: cmake --build build --config ${{ matrix.build_type }} --target bench

    - name: Test
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
