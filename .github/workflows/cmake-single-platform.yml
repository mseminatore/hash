# Build and test on Linux and Windows in Debug and Release.
# (File name kept for the README badge.)
name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.build_type }}${{ matrix.stats == 'off' && ' (stats off)' || '' }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Debug, Release ]
        stats: [ 'on' ]
        include:
          # stats compiled out, to keep that configuration building.
          # 'stats' must differ from the base matrix, or this entry would
          # just add c_flags to the existing ubuntu/Release job
          - os: ubuntu-latest
            build_type: Release
            stats: 'off'
            c_flags: -DHT_TRACK_STATS=0

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      # CMAKE_BUILD_TYPE is used by single-config generators (make/ninja); --config by multi-config (Visual Studio)
      # only override CMAKE_C_FLAGS when set, so compiler default flags are kept
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.c_flags && format('-DCMAKE_C_FLAGS={0}', matrix.c_flags) || '' }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Build benchmarks
      run: cmake --build build --config ${{ matrix.build_type }} --target bench

    - name: Test
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
